<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sakriya Awal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #312e81);
            color: white;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 50px 40px;
            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);

            animation: fadeIn 0.8s ease;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 17px;
            color: #cbd5e1;
            margin-bottom: 35px;
        }

        .project-link {
            display: inline-block;
            padding: 15px 28px;

            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;

            background: linear-gradient(135deg, #7c3aed, #2563eb);
            border-radius: 12px;

            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);

            transition: all 0.25s ease;
        }

        .project-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.5);
        }

        .project-link:active {
            transform: translateY(0);
        }

        footer {
            margin-top: 35px;
            font-size: 13px;
            color: #94a3b8;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 34px;
            }

            .subtitle {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Welcome</h1>

        <p class="subtitle">
            Welcome to Sakriya Awal's website
        </p>

        <a
            class="project-link"
            href="https://fpl-multileague-ui.sakriyaawal.workers.dev/?league=bhaktapurian"
        >
            ⚽ FPL Bhaktapurian
        </a>
        <a
            class="project-link"
            href="https://fpl-multileague-ui.sakriyaawal.workers.dev/?league=shadowclassic"
        >
            ⚽ FPL Shadow Classic
        </a>
        <a
            class="project-link"
            href="https://fpl-multileague-ui.sakriyaawal.workers.dev/?league=shadowelimination"
        >
            ⚽ FPL Shadow Elimination
        </a>

        <footer>
            © 2026 Sakriya Awal
        </footer>

    </main>

</body>
</html>
